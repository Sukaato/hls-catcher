name: Release Dev

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  version:
    name: Compute dev version
    runs-on: ubuntu-latest
    outputs:
      dev-version: ${{ steps.dev-version.outputs.version }}
    steps:
      - name: Calculate dev version
        id: dev-version
        run: |
          SHA_SHORT=${GITHUB_SHA:0:7}
          echo "version=0.0.0-dev.${{ github.run_number }}.${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log dev version
        run: echo "📦 ${{ steps.dev-version.outputs.version }}"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/actions/quality

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [version, quality]
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Set dev version
        run: npm version ${{ needs.version.outputs.dev-version }} --no-git-tag-version --allow-same-version

      - name: Zip extension
        run: bunx wxt zip -b ${{ matrix.browser }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hls-catcher-dev-${{ matrix.browser }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 7

  comment-pr:
    name: Comment PR
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.version.outputs.dev-version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- hls-catcher-dev -->';
            const body = [
              marker,
              '## 📦 Build de dev disponible',
              '',
              `Version \`${version}\` — construite pour **chrome**, **firefox** et **edge**.`,
              '',
              `➡️ [Télécharger les artefacts](${runUrl}) (section « Artifacts » en bas de la page).`,
              '',
              'Charger : `chrome://extensions` → mode dev → « Charger l\'extension non empaquetée »',
              'après avoir dézippé, ou glisser le `.zip` directement.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
